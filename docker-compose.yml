version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: food_platform_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: food_platform
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - platform_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: food_platform_adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - platform_network
    depends_on:
      - mysql

volumes:
  mysql_data:

networks:
  platform_network:
    driver: bridge
